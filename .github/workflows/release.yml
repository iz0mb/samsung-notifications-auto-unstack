name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: Release version name (for example 1.0.1)
        required: true
        type: string
      version_code:
        description: Optional Android versionCode override
        required: false
        type: string
      create_release:
        description: Publish a GitHub release with the APK attached
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Require main branch for manual releases
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ github.event.repository.default_branch }}" ]; then
            echo "Manual releases must run from ${{ github.event.repository.default_branch }}."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare signing configuration
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEY_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/auto-unstack-key.jks"
            echo "signed=true" >> "${GITHUB_OUTPUT}"
            echo "keystore_path=${RUNNER_TEMP}/auto-unstack-key.jks" >> "${GITHUB_OUTPUT}"
          else
            echo "Signing secrets are not fully configured; building an unsigned release APK."
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "keystore_path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Resolve release metadata
        id: metadata
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            version_name="${GITHUB_REF_NAME#v}"
            tag_name="${GITHUB_REF_NAME}"
          else
            version_name="${INPUT_VERSION_NAME}"
            tag_name="v${version_name}"
          fi

          version_code="${INPUT_VERSION_CODE:-${GITHUB_RUN_NUMBER}}"

          echo "version_name=${version_name}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Build release APK
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: ./gradlew assembleRelease

      - name: Resolve APK artifact path
        id: apk
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "${apk_path}" ]; then
            echo "No release APK was produced."
            exit 1
          fi

          echo "path=${apk_path}" >> "${GITHUB_OUTPUT}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ steps.metadata.outputs.version_name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Publish GitHub release
        if: github.event_name == 'push' || inputs.create_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.metadata.outputs.tag_name }}" \
            "${{ steps.apk.outputs.path }}" \
            --target "${GITHUB_SHA}" \
            --title "Auto Unstack ${{ steps.metadata.outputs.version_name }}" \
            --notes "Release built from ${GITHUB_SHA}."
