name: Setup Signing

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore and signing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ALIAS="auto-unstack"
          KEYSTORE_FILE="${RUNNER_TEMP}/auto-unstack-key.jks"

          # Generate cryptographically random passwords
          KEYSTORE_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"
          KEY_PASSWORD="$(openssl rand -base64 32 | tr -dc 'A-Za-z0-9' | head -c 32)"

          # Generate PKCS12 keystore (100-year validity, no interactive prompts)
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore "${KEYSTORE_FILE}" \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -alias "${ALIAS}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -dname "CN=Auto Unstack, O=Auto Unstack, C=US" \
            -noprompt \
            2>/dev/null

          # Store all four secrets in the repository
          REPO="${GITHUB_REPOSITORY}"
          base64 < "${KEYSTORE_FILE}" | tr -d '\n' \
            | gh secret set KEYSTORE_BASE64 --repo "${REPO}"
          printf '%s' "${KEYSTORE_PASSWORD}" | gh secret set KEYSTORE_PASSWORD --repo "${REPO}"
          printf '%s' "${ALIAS}"             | gh secret set KEY_ALIAS          --repo "${REPO}"
          printf '%s' "${KEY_PASSWORD}"      | gh secret set KEY_PASSWORD       --repo "${REPO}"

          rm -f "${KEYSTORE_FILE}"

          echo ""
          echo "✓ Signing secrets saved to ${REPO}:"
          echo "    KEYSTORE_BASE64   — PKCS12 keystore (base64)"
          echo "    KEYSTORE_PASSWORD — keystore password"
          echo "    KEY_ALIAS         — ${ALIAS}"
          echo "    KEY_PASSWORD      — key password"
          echo ""
          echo "Run the 'Release APK' workflow to publish a signed release."
